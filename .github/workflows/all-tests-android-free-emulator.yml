name: All Tests (API + Web + Android Free Emulator)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:check

      - name: Check code formatting
        run: npm run format:check

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm run test:api

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 30

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Web tests
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          WEB_CREDENTIALS_USERNAME: ${{ secrets.WEB_CREDENTIALS_USERNAME }}
          WEB_CREDENTIALS_PASSWORD: ${{ secrets.WEB_CREDENTIALS_PASSWORD }}
          WEB_HEADLESS: ${{ secrets.WEB_HEADLESS }}
        run: npm run test:web

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-web
          path: allure-results
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos-web
          path: test-results
          retention-days: 7

  mobile-tests:
    name: Mobile Tests (Android Emulator)
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Mobile Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILE_PLATFORM: android
          MOBILE_IS_CLOUD: false
          MOBILE_CREDENTIALS_USERNAME: ${{ secrets.MOBILE_CREDENTIALS_USERNAME }}
          MOBILE_CREDENTIALS_PASSWORD: ${{ secrets.MOBILE_CREDENTIALS_PASSWORD }}
          APPIUM_LOCAL_URL: http://127.0.0.1:4723/
          ANDROID_LOCAL_DEVICE_NAME: ${{ secrets.ANDROID_LOCAL_DEVICE_NAME }}
          ANDROID_LOCAL_PLATFORM_VERSION: ${{ secrets.ANDROID_LOCAL_PLATFORM_VERSION }}
          ANDROID_LOCAL_APP_PACKAGE: ${{ secrets.ANDROID_LOCAL_APP_PACKAGE }}
          ANDROID_LOCAL_APP_ACTIVITY: ${{ secrets.ANDROID_LOCAL_APP_ACTIVITY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            npx appium &
            sleep 5
            adb install main/mobile/apps/AppAndroid.apk
            npm run test:mobile

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-mobile
          path: allure-results
          retention-days: 30

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-tests, web-tests, mobile-tests]
    if: always()
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Allure Results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Load test report history
        uses: actions/checkout@v6
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to Github Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: allure-history
          clean: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Send Telegram notification
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x send-telegram-notification.sh
          ./send-telegram-notification.sh
